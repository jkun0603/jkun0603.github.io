<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="博客 - 分享技术、思考与生活" />
  <title>博客 | 个人主页</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
  <style>
    .blog-card { position: relative; }
    .blog-delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: rgba(239,68,68,0.1);
      color: #ef4444;
      font-size: 0.9rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .blog-card:hover .blog-delete-btn { opacity: 1; }
    .blog-delete-btn:hover { background: rgba(239,68,68,0.25); }
    @media (pointer: coarse) {
      .blog-delete-btn { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="container">
      <a href="/" class="nav-logo">✦</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/projects.html">作品</a></li>
        <li><a href="/blog.html">博客</a></li>
        <li><a href="/about.html">关于</a></li>
        <li><a href="/contact.html">联系</a></li>
        <li>
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
            <span class="theme-icon">🌙</span>
          </button>
        </li>
      </ul>
      <button class="mobile-menu-btn" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h1 class="fade-in">博客</h1>
      <p class="fade-in fade-in-d1">记录学习、工作与生活中的点滴。</p>
      <div class="fade-in fade-in-d2" style="margin-top:20px;">
        <a href="/write.html" class="btn btn-primary" style="font-size:0.9rem;">✏️ 写文章</a>
      </div>
    </div>
  </section>

  <!-- Blog List -->
  <section class="section">
    <div class="container">
      <div class="blog-grid" id="blogGrid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-copy">© 2026 · All rights reserved.</div>
        <div class="footer-social">
          <a href="#" aria-label="GitHub" target="_blank">GH</a>
          <a href="#" aria-label="Twitter" target="_blank">TW</a>
          <a href="#" aria-label="Email" target="_blank">EM</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>
</html>
