  <script>
    // GitHub API helpers + delete post (only used when token exists)
    (function() {
      var REPO = 'jkun0603/jkun0603.github.io';
      var BRANCH = 'main';

      function gh(endpoint, method, body) {
        var token = localStorage.getItem('gh_blog_token');
        if (!token) return Promise.reject(new Error('No token'));
        var opts = {
          method: method || 'GET',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github.v3+json',
          },
        };
        if (body) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        }
        return fetch('https://api.github.com' + endpoint, opts).then(function(r) {
          if (!r.ok) return r.json().then(function(e) { throw new Error(e.message || ('HTTP ' + r.status)); });
          return r.json().then(function(d) { return d; }).catch(function() { return {}; });
        });
      }

      function utf8ToBase64(str) {
        return btoa(unescape(encodeURIComponent(str)));
      }

      function getSha(path) {
        return gh('/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH)
          .then(function(data) { return data && data.sha ? data.sha : null; })
          .catch(function() { return null; });
      }

      function putFile(path, content, message) {
        return getSha(path).then(function(sha) {
          var payload = {
            message: message || 'Update ' + path,
            content: utf8ToBase64(content),
            branch: BRANCH,
          };
          if (sha) payload.sha = sha;
          return gh('/repos/' + REPO + '/contents/' + path, 'PUT', payload);
        });
      }

      function deleteFile(path, message) {
        return getSha(path).then(function(sha) {
          if (!sha) return Promise.resolve();
          return gh('/repos/' + REPO + '/contents/' + path, 'DELETE', {
            message: message || 'Delete ' + path,
            sha: sha,
            branch: BRANCH,
          });
        });
      }

      window.deleteCmsPost = function(slug, btn) {
        btn.disabled = true;
        btn.textContent = '⏳';

        // Step 1: delete the markdown file
        deleteFile('posts/' + slug + '.md', 'delete: remove post ' + slug)
          .then(function() {
            // Step 2: update posts.json
            return gh('/repos/' + REPO + '/contents/posts/posts.json?ref=' + BRANCH);
          })
          .then(function(data) {
            if (!data || !data.content) throw new Error('无法读取 posts.json');
            // GitHub API returns base64 with newlines
            var raw = atob(data.content.replace(/\n/g, ''));
            // Decode UTF-8
            var content = decodeURIComponent(escape(raw));
            var json;
            try { json = JSON.parse(content); } catch(e) { throw new Error('无法解析 posts.json: ' + e.message); }
            if (!json.posts) json.posts = [];
            var before = json.posts.length;
            json.posts = json.posts.filter(function(p) { return p.slug !== slug; });
            if (json.posts.length === before) throw new Error('未在 posts.json 中找到该文章记录');
            var newContent = JSON.stringify(json, null, 2);
            return putFile('posts/posts.json', newContent, 'delete: remove ' + slug + ' from index');
          })
          .then(function() {
            var card = btn.closest('.blog-card, article');
            if (card) card.remove();
          })
          .catch(function(err) {
            console.error('Delete failed:', err);
            btn.disabled = false;
            btn.textContent = '\u{1F5D1}️';
            alert('删除失败：' + err.message + '\n\n请按 F12 查看控制台详细信息，或检查你的 GitHub Token 是否有 Contents 读写权限。');
          });
      };
      };
    })();
  </script>
