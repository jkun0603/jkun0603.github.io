<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="作品集 - 我的项目展示" />
  <title>作品集 | 个人主页</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="container">
      <a href="/" class="nav-logo">✦</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/projects.html">作品</a></li>
        <li><a href="/blog.html">博客</a></li>
        <li><a href="/about.html">关于</a></li>
        <li><a href="/contact.html">联系</a></li>
        <li>
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
            <span class="theme-icon">🌙</span>
          </button>
        </li>
      </ul>
      <button class="mobile-menu-btn" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h1 class="fade-in">作品集</h1>
      <p class="fade-in fade-in-d1">一些我做过的项目，涵盖 Web 开发与设计。</p>
    </div>
  </section>

  <!-- Projects Grid -->
  <section class="section">
    <div class="container">
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-copy">© 2026 · All rights reserved.</div>
        <div class="footer-social">
          <a href="#" aria-label="GitHub" target="_blank">GH</a>
          <a href="#" aria-label="Twitter" target="_blank">TW</a>
          <a href="#" aria-label="Email" target="_blank">EM</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var grid = document.getElementById('projectsGrid');
      if (!grid) return;

      var url = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? '/projects/projects.json'
        : 'https://raw.githubusercontent.com/jkun0603/jkun0603.github.io/main/projects/projects.json';

      fetch(url, { cache: 'no-cache' })
        .then(function(r) {
          if (!r.ok) throw new Error('Failed');
          return r.json();
        })
        .then(function(data) {
          if (!data || !data.projects || !data.projects.length) return;
          var projects = data.projects.slice().sort(function(a, b) {
            return (b.date || '').localeCompare(a.date || '');
          });
          projects.forEach(function(p, i) {
            var link = '/projects/view.html?slug=' + p.slug;
            var emoji = p.emoji || '📦';
            var tags = p.tags || [];
            var date = p.date || '';
            var summary = p.summary || '';
            var div = document.createElement('div');
            div.className = 'project-card fade-in fade-in-d' + ((i % 4) + 1);
            var imageHtml = p.image
              ? '<img src="' + p.image + '" alt="" loading="lazy" />'
              : '<div style="font-size:4rem;padding:40px 0;text-align:center;">' + emoji + '</div>';
            div.innerHTML = '<a href="' + link + '" class="card-link">' +
              '<div class="project-card-image">' + imageHtml + '</div>' +
              '<div class="project-card-body">' +
              '<h3>' + p.title + '</h3>' +
              '<p>' + summary + '</p>' +
              '<div class="blog-card-meta">' + date + '</div>' +
              '<div class="project-tags">' + tags.map(function(t) {
                return '<span class="project-tag">' + t + '</span>';
              }).join('') + '</div>' +
              '</div></a>';
            grid.appendChild(div);
          });
          if (typeof initScrollAnimations === 'function') initScrollAnimations();
        })
        .catch(function() {
          grid.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-secondary);">暂无项目。</p>';
        });
    });
  </script>
</body>
</html>
