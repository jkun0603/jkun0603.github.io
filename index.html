<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人主页 - 分享技术、作品与思考" />
  <title>个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
</head>
<body>

  <!-- Intro Overlay -->
  <div id="intro-overlay" aria-hidden="true"><!--bin-->
    <div class="intro-strip" aria-hidden="true"></div>
    <div class="intro-wheel" aria-hidden="true"></div>
    <div class="intro-scene">
      <div class="intro-letters">
        <span class="intro-letter" style="--i:0">B</span>
        <span class="intro-letter" style="--i:1">I</span> 
        <span class="intro-letter" style="--i:2">N</span>
        <span class="intro-letter" style="--i:2">Welcome</span>
      </div>
      <p class="intro-hint">向下滚动</p>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar" role="navigation">
    <div class="container">
      <a href="/" class="nav-logo">✦</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/projects.html">作品</a></li>
        <li><a href="/blog.html">博客</a></li>
        <li><a href="/about.html">关于</a></li>
        <li><a href="/contact.html">联系</a></li>
        <li>
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
            <span class="theme-icon">🌙</span>
          </button>
        </li>
      </ul>
      <button class="mobile-menu-btn" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Intro Spacer (creates room to scroll the intro away) -->
  <div class="intro-spacer"></div>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <span class="greeting fade-in">你好，我是</span>
        <div class="hero-name-row fade-in fade-in-d1">
          <h1>你的名字</h1>
        </div>
        <p class="fade-in fade-in-d2">
          一个热爱技术与创造的人。专注于构建用户体验优秀的 Web 应用，
          热衷于探索前沿技术并分享所学。
        </p>
        <div class="hero-buttons fade-in fade-in-d3">
          <a href="/projects.html" class="btn btn-primary">查看作品 →</a>
          <a href="/about.html" class="btn btn-secondary">关于我</a>
        </div>
      </div>
      <img src="/assets/images/樱岛麻衣.png" class="hero-deco-img" alt="" />
    </div>
    <div class="hero-tags-area" id="heroTags"></div>
    <div class="scroll-indicator">
      <div class="mouse"></div>
      <span>向下滚动</span>
    </div>
  </section>

  <!-- Featured Projects -->
  <section class="section">
    <div class="container">
      <span class="section-label fade-in">精选作品</span>
      <h2 class="section-title fade-in fade-in-d1">最近项目</h2>
      <p class="section-subtitle fade-in fade-in-d2">一些我近期完成或者正在进行的项目。</p>
      <div class="feature-grid" id="featuredProjects"></div>
    </div>
  </section>

  <!-- Recent Blog Posts -->
  <section class="section" style="background:var(--bg-secondary);">
    <div class="container">
      <span class="section-label fade-in">最新文章</span>
      <h2 class="section-title fade-in fade-in-d1">博客动态</h2>
      <p class="section-subtitle fade-in fade-in-d2">记录学习过程与日常思考。</p>
      <div class="feature-grid" id="featuredPosts"></div>
      <div style="text-align:center;margin-top:32px;" class="fade-in">
        <a href="/blog.html" class="btn btn-secondary">查看全部文章 →</a>
      </div>
    </div>
  </section>

  <!-- Contact CTA -->
  <section class="section">
    <div class="container" style="text-align:center;">
      <h2 class="section-title fade-in">保持联系</h2>
      <p class="section-subtitle fade-in fade-in-d1" style="margin:0 auto 32px;">
        有任何问题或合作意向？欢迎随时联系我。
      </p>
      <div class="fade-in fade-in-d2">
        <a href="/contact.html" class="btn btn-primary">联系我 →</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-copy">© 2026 · All rights reserved.</div>
        <div class="footer-social">
          <a href="#" aria-label="GitHub" target="_blank">GH</a>
          <a href="#" aria-label="Twitter" target="_blank">TW</a>
          <a href="#" aria-label="Email" target="_blank">EM</a>
        </div>
      </div>
    </div>
  </footer>

  <div id="lanyard-container" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/assets/js/lanyard-card.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <script type="module" src="/assets/js/galaxy.js"></script>
  <script>
    // Featured projects for homepage
    document.addEventListener('DOMContentLoaded', () => {
      const fp = document.getElementById('featuredProjects');
      if (fp) {
        const items = [
          { emoji: '🌐', title: '个人品牌网站', summary: '纯 HTML/CSS/JS 响应式个人站，支持深色模式。', tags: ['HTML', 'CSS', 'JS'], link: '/projects/personal-website.html', date: '2026-07-17' },
          { emoji: '💡', title: '下一个精彩项目', summary: '灵感正在孵化中，精彩项目即将到来。', tags: ['筹备中'], link: '/projects/next-project.html', date: '2026-07-01' },
          { emoji: '🚧', title: '更多项目', summary: '持续建设中，敬请期待。', tags: ['筹备中'], link: '/projects/coming-soon.html', date: '2026-06-01' },
        ];
        // Sort by date descending, take up to 6
        items.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
        var maxProjects = Math.min(items.length, 4);
        for (var i = 0; i < maxProjects; i++) {
          var p = items[i];
          var div = document.createElement('div');
          div.className = 'project-card fade-in fade-in-d' + ((i % 4) + 2);
          div.innerHTML = '<a href="' + p.link + '" class="card-link">' +
            '<div class="project-card-image">' + p.emoji + '</div>' +
            '<div class="project-card-body">' +
            '<h3>' + p.title + '</h3>' +
            '<p>' + p.summary + '</p>' +
            '<div class="project-tags">' + p.tags.map(function(t) { return '<span class="project-tag">' + t + '</span>'; }).join('') + '</div>' +
            '</div></a>';
          fp.appendChild(div);
        }
      }

      const fposts = document.getElementById('featuredPosts');
      if (!fposts) return;

      // Try loading from JSON index, fallback to hardcoded
      function renderPosts(posts) {
        posts.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
        var maxPosts = Math.min(posts.length, 4);
        for (var i = 0; i < maxPosts; i++) {
          var p = posts[i];
          var link = p.link || (p.slug ? '/blog/view.html?slug=' + p.slug : '#');
          var emoji = p.emoji || '\u{1F4DD}';
          var tags = p.tags || [];
          var date = p.date || '';
          var summary = p.summary || '';
          var div = document.createElement('div');
          div.className = 'blog-card fade-in fade-in-d' + ((i % 4) + 2);
          div.innerHTML = '<a href="' + link + '" class="card-link">' +
            '<div class="blog-card-image">' + emoji + '</div>' +
            '<div class="blog-card-body">' +
            '<div class="blog-card-meta">' + date + '</div>' +
            '<h3>' + p.title + '</h3>' +
            '<p>' + summary + '</p>' +
            '<div class="blog-card-tags">' + tags.map(function(t) { return '<span class="blog-tag">' + t + '</span>'; }).join('') + '</div>' +
            '</div></a>';
          fposts.appendChild(div);
        }
        initScrollAnimations();
        initTiltedCards();
      }

      var fallbackPosts = [
        { emoji: '\u{1F680}', title: '我的第一篇博客文章', date: '2026-07-15', summary: '搭建个人站的过程和心得。', tags: ['随笔'], link: '/blog/getting-started.html' },
        { emoji: '\u{1F3A8}', title: '理解现代 CSS 布局', date: '2026-07-10', summary: 'Flexbox 和 Grid 布局核心概念。', tags: ['技术'], link: '/blog/css-layout.html' },
        { emoji: '\u{1F4DD}', title: '2026 年中技术总结', date: '2026-06-30', summary: '回顾上半年学习的技术和新掌握的工具。', tags: ['技术'], link: '/blog/mid-year-review.html' },
        { emoji: '⚡', title: 'JavaScript 实用技巧', date: '2026-06-15', summary: '日常开发中积累的 JS 技巧和最佳实践。', tags: ['技术'], link: '/blog/js-tips.html' },
      ];

      fetch('/posts/posts.json')
        .then(function(r) {
          if (!r.ok) throw new Error('Failed');
          return r.json();
        })
        .then(function(data) {
          if (data && data.posts && data.posts.length) {
            renderPosts(data.posts);
          } else {
            renderPosts(fallbackPosts);
          }
        })
        .catch(function() {
          renderPosts(fallbackPosts);
        });
    });
  </script>
</body>
</html>
